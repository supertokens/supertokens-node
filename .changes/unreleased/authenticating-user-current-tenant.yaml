kind: Fixed
body: Sign in on a tenant no longer fails with "You have found a bug" when a primary user shared with that tenant has a matching login method of the same recipe only on another tenant. Login methods outside the current tenant are no longer treated as the authenticating login method. As a result, a sign in whose matching login method of that recipe exists only on another tenant is now handled as a sign up, so sign up checks apply and `SIGN_IN_UP_NOT_ALLOWED` can be returned. With a session from that primary user, the login method's recipe user is associated with the current tenant when its credentials are valid on its own tenant.
