kind: Fixed
body: Sign in on a tenant no longer fails with "You have found a bug" when a primary user shared with that tenant has a matching login method of the same recipe only on another tenant. If another user of the current tenant already holds some of a session login method's account info, the login method is skipped instead of retrying until the request fails. Passwordless `createCodePOST` and `resendCodePOST` use the same session fallback checks as `consumeCodePOST`, so they agree on sign in versus sign up.
