kind: Changed
body: "session: `validateClaimsForSessionHandle` now fetches claim values for the session's tenant, and leaves protected access token payload claims (such as `sub` and `tId`) out of the payload update it saves. In multi-tenant apps, claims it refetches (e.g. user roles, permissions or the MFA claim) for sessions of tenants other than the public one now get the values for the session's tenant, both in the returned validation result and in the updated access token payload. Sessions of the public tenant are handled as before."
