kind: Changed
body: Login methods outside the current tenant are no longer treated as the authenticating login method. When the matching login method exists only on another tenant, passwordless `consumeCodePOST` and third-party `signInUpPOST` handle the attempt as a sign up, so sign up checks apply and `SIGN_IN_UP_NOT_ALLOWED` can be returned. Email-password and webauthn `signInPOST` return `WRONG_CREDENTIALS_ERROR` and `INVALID_CREDENTIALS_ERROR`. With a session from that primary user, email-password, passwordless and third-party login methods can instead be associated with the current tenant after credential verification on an existing tenant. Session login methods associated with no tenant are skipped for all three recipes, without credential verification or tenant association.
